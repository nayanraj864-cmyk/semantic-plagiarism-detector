server {
    listen 80;
    server_name localhost;

    # ── Strict Content Security Policy (Issue #1561) ────────────────────────
    # Nginx-level headers act as a defence-in-depth layer in front of the
    # Python ASGI middleware.  Both must be consistent: if the ASGI app also
    # emits Content-Security-Policy the *last* header seen by the browser
    # wins, so we omit the header here and let the ASGI layer own it.
    # The remaining security headers below are also emitted by the ASGI
    # middleware but are duplicated here for environments that bypass the app
    # server (e.g. nginx serving static assets directly).

    # ── Clickjacking / framing ───────────────────────────────────────────────
    add_header X-Frame-Options              "DENY"                                  always;

    # ── MIME-sniffing prevention ─────────────────────────────────────────────
    add_header X-Content-Type-Options       "nosniff"                               always;

    # ── Legacy XSS filter ───────────────────────────────────────────────────
    add_header X-XSS-Protection             "1; mode=block"                         always;

    # ── Referrer policy ─────────────────────────────────────────────────────
    add_header Referrer-Policy              "strict-origin-when-cross-origin"       always;

    # ── Permissions / Feature policy ────────────────────────────────────────
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://app:8501/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;

        # Security headers also applied to cached static responses.
        add_header X-Frame-Options         "DENY"                                  always;
        add_header X-Content-Type-Options  "nosniff"                               always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"       always;
    }
}
